# Server Port (supports Render/cloud dynamic PORT, defaults to 8085 locally)
server.port=${PORT:8085}

# Demo users and sample borrowing records are created only when explicitly enabled.
library.demo-data.enabled=${LIBRARY_DEMO_DATA_ENABLED:false}

# Database Configuration (supports MySQL & PostgreSQL via env vars with local MySQL defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}

# JPA / Hibernate Settings (Hibernate automatically detects the dialect for MySQL/PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Static Resources Mapping (Serves frontend static HTML/CSS/JS directly)
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/
spring.mvc.static-path-pattern=/**

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
