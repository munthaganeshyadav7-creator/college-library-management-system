<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Audit Reports & Penalties - College Library</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @media print {
      .navbar, .footer, .report-nav, .btn, .search-bar-wrapper { display: none !important; }
      .main-container { max-width: 100%; padding: 0; }
      .content-card { box-shadow: none; border: 1px solid #000; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Main Content -->
  <div class="main-container">
    
    <div class="page-header">
      <div>
        <h1 class="page-title">📊 Administrative Audit Reports & Penalties</h1>
        <p class="page-subtitle">Analyze institutional circulation logs, unreturned overdue textbooks, and fine collections.</p>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="window.print()">🖨️ Print / Export Report</button>
      </div>
    </div>

    <!-- Report Selection Tabs -->
    <div class="category-pills report-nav" style="margin-bottom: 1.5rem;">
      <button class="category-pill active" onclick="switchReportTab('borrowing')">📑 All Circulation Records</button>
      <button class="category-pill" onclick="switchReportTab('overdue')">⚠ Overdue Loans Report</button>
      <button class="category-pill" onclick="switchReportTab('penalties')">💰 Penalty & Fine Audit</button>
    </div>

    <!-- Financial Summary Banner for Reports -->
    <div class="stats-grid" id="report-financial-banner">
      <div class="stat-card">
        <div class="stat-info">
          <div class="stat-label">Total Recorded Fines</div>
          <div class="stat-value" id="rep-total-fines">₹0.00</div>
        </div>
        <div class="stat-icon icon-blue">💳</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <div class="stat-label">Collected Fines (Paid)</div>
          <div class="stat-value" id="rep-paid-fines">₹0.00</div>
        </div>
        <div class="stat-icon icon-green">✓</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <div class="stat-label">Outstanding Dues (Unpaid)</div>
          <div class="stat-value" id="rep-unpaid-fines">₹0.00</div>
        </div>
        <div class="stat-icon icon-rose">💰</div>
      </div>
    </div>

    <!-- Report Table Container -->
    <div class="content-card">
      <div class="content-card-header">
        <h2 class="content-card-title" id="report-table-title">📑 Master Circulation Audit Report</h2>
        <span id="report-count-badge" class="badge badge-info">0 records</span>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead id="report-thead">
            <!-- Dynamic Headers -->
          </thead>
          <tbody id="report-tbody">
            <tr>
              <td colspan="9" style="text-align:center; color: var(--text-muted);">Generating report...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="js/script.js"></script>
  <script>
    let currentTab = 'borrowing';

    document.addEventListener('DOMContentLoaded', () => {
      if (!checkPageAccess(['ADMIN', 'LIBRARIAN'])) return;
      renderNavbar('reports');
      loadReportData();
    });

    function switchReportTab(tab) {
      currentTab = tab;
      const pills = document.querySelectorAll('.category-pill');
      pills.forEach(p => {
        if (p.getAttribute('onclick').includes(tab)) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
      loadReportData();
    }

    async function loadReportData() {
      // 1. Fetch live metrics
      try {
        const dRes = await fetch(`${API_BASE_URL}/dashboard`, { headers: getAuthHeaders() });
        const dResult = await dRes.json();
        if (dResult.success && dResult.data) {
          const d = dResult.data;
          document.getElementById('rep-total-fines').textContent = formatCurrency(d.totalRecordedPenalties);
          document.getElementById('rep-paid-fines').textContent = formatCurrency(d.paidPenalties);
          document.getElementById('rep-unpaid-fines').textContent = formatCurrency(d.unpaidPenalties);
        }
      } catch (e) {}

      // 2. Fetch Report Records
      let endpoint = `${API_BASE_URL}/reports/borrowing`;
      if (currentTab === 'overdue') endpoint = `${API_BASE_URL}/reports/overdue`;
      if (currentTab === 'penalties') endpoint = `${API_BASE_URL}/reports/penalties`;

      try {
        const res = await fetch(endpoint, { headers: getAuthHeaders() });
        const result = await res.json();
        const thead = document.getElementById('report-thead');
        const tbody = document.getElementById('report-tbody');
        const countBadge = document.getElementById('report-count-badge');
        const titleEl = document.getElementById('report-table-title');

        if (currentTab === 'borrowing') {
          titleEl.textContent = '📑 Master Circulation Audit Report (All Issues & Returns)';
        } else if (currentTab === 'overdue') {
          titleEl.textContent = '⚠ Unreturned Overdue Loans Report (Late Borrowers)';
        } else {
          titleEl.textContent = '💰 Late Penalty & Financial Collection Audit';
        }

        if (result.success && result.data) {
          countBadge.textContent = `${result.data.length} records`;

          if (result.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color: var(--text-muted); padding:2rem;">No records found for this audit report.</td></tr>';
            return;
          }

          thead.innerHTML = `
            <tr>
              <th>ID</th>
              <th>Student Name</th>
              <th>Student Email</th>
              <th>Book Title</th>
              <th>Category</th>
              <th>Issue Date</th>
              <th>Due Date</th>
              <th>Return Date</th>
              <th>Status</th>
              <th>Overdue Days</th>
              <th>Fine Amount</th>
              <th>Fine Paid</th>
            </tr>
          `;

          tbody.innerHTML = result.data.map(r => {
            const isLate = r.status === 'OVERDUE' || (r.status === 'ISSUED' && r.overdueDays > 0);
            let statusBadge = '';
            if (r.status === 'RETURNED') {
              statusBadge = '<span class="badge badge-success">RETURNED</span>';
            } else if (isLate) {
              statusBadge = '<span class="badge badge-danger">OVERDUE</span>';
            } else {
              statusBadge = '<span class="badge badge-info">ISSUED</span>';
            }

            let penaltyBadge = '-';
            const fine = r.penaltyAmount > 0 ? r.penaltyAmount : (r.estimatedPenalty || 0);
            if (fine > 0) {
              penaltyBadge = r.penaltyPaid 
                ? '<span class="badge badge-success">PAID</span>' 
                : '<span class="badge badge-danger">UNPAID</span>';
            } else {
              penaltyBadge = '<span class="badge badge-success">₹0</span>';
            }

            return `
              <tr>
                <td>#${r.id}</td>
                <td><strong>${r.studentName}</strong></td>
                <td>${r.studentEmail}</td>
                <td>${r.bookTitle}</td>
                <td>${r.bookCategory}</td>
                <td>${formatDate(r.issueDate)}</td>
                <td>${formatDate(r.dueDate)}</td>
                <td>${formatDate(r.returnDate)}</td>
                <td>${statusBadge}</td>
                <td style="color: ${r.overdueDays > 0 ? 'var(--danger)' : 'inherit'}; font-weight: ${r.overdueDays > 0 ? '700' : 'normal'}">
                  ${r.overdueDays > 0 ? `${r.overdueDays} days` : '0'}
                </td>
                <td style="color: ${fine > 0 ? 'var(--danger)' : 'inherit'}; font-weight: 700;">
                  ${formatCurrency(fine)}
                </td>
                <td>${penaltyBadge}</td>
              </tr>
            `;
          }).join('');
        }
      } catch (e) {
        document.getElementById('report-tbody').innerHTML = '<tr><td colspan="9" style="text-align:center; color: var(--danger);">Failed to generate report.</td></tr>';
      }
    }
  </script>
</body>
</html>
