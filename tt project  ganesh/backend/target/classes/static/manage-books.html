<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Book Inventory - College Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Main Content -->
  <div class="main-container">
    
    <div class="page-header">
      <div>
        <h1 class="page-title">📦 Book Inventory Management</h1>
        <p class="page-subtitle">Add new titles, edit textbook details, update stock quantities, and audit availability.</p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openAddBookModal()">+ Add New Book Title</button>
      </div>
    </div>

    <div id="manage-alert"></div>

    <!-- Inventory Filter & Search -->
    <div class="content-card" style="padding: 1.25rem;">
      <div class="search-bar-wrapper">
        <input type="text" id="inventory-search" class="form-control search-input" placeholder="Search by book title, author, or category...">
        <button class="btn btn-primary" onclick="loadInventory()">Search</button>
        <button class="btn btn-secondary" onclick="document.getElementById('inventory-search').value=''; loadInventory();">Reset</button>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="content-card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Book Title</th>
              <th>Author</th>
              <th>Category / Discipline</th>
              <th>Total Stock</th>
              <th>Available</th>
              <th>Issued</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-tbody">
            <tr>
              <td colspan="9" style="text-align: center; color: var(--text-muted);">Loading book inventory...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Add Book Modal -->
  <div class="modal-overlay" id="add-book-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="content-card-title">Add New Book to Library</h3>
        <button class="modal-close" onclick="closeModal('add-book-modal')">&times;</button>
      </div>
      <div id="modal-alert"></div>
      <form onsubmit="handleSaveBook(event)">
        <input type="hidden" id="book-edit-id" value="">
        <div class="form-group">
          <label class="form-label" for="book-title">Book Title *</label>
          <input type="text" id="book-title" class="form-control" placeholder="e.g. Operating System Concepts" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="book-author">Author *</label>
          <input type="text" id="book-author" class="form-control" placeholder="e.g. Abraham Silberschatz" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="book-category">Category / Discipline *</label>
          <input type="text" id="book-category" class="form-control" placeholder="e.g. Computer Science" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="book-quantity">Total Quantity (Copies) *</label>
          <input type="number" id="book-quantity" class="form-control" min="1" value="5" required>
        </div>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('add-book-modal')">Cancel</button>
          <button type="submit" id="save-book-btn" class="btn btn-primary">Save Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="js/script.js"></script>
  <script>
    let inventoryData = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!checkPageAccess(['LIBRARIAN', 'ADMIN'])) return;
      renderNavbar('manage-books');
      loadInventory();

      document.getElementById('inventory-search').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') loadInventory();
      });
    });

    async function loadInventory() {
      const search = document.getElementById('inventory-search').value.trim();
      const url = search ? `${API_BASE_URL}/books?search=${encodeURIComponent(search)}` : `${API_BASE_URL}/books`;
      try {
        const res = await fetch(url);
        const result = await res.json();
        const tbody = document.getElementById('inventory-tbody');

        if (result.success && result.data) {
          inventoryData = result.data;
          if (result.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">No books found.</td></tr>';
            return;
          }

          tbody.innerHTML = result.data.map(b => {
            const issuedCopies = b.quantity - b.availableQuantity;
            return `
              <tr>
                <td>#${b.id}</td>
                <td><strong>${b.title}</strong></td>
                <td>${b.author}</td>
                <td><span class="badge badge-info">${b.category}</span></td>
                <td><strong>${b.quantity}</strong></td>
                <td style="color: ${b.availableQuantity > 0 ? 'var(--success)' : 'var(--danger)'}; font-weight: 700;">
                  ${b.availableQuantity}
                </td>
                <td>${issuedCopies}</td>
                <td>
                  <span class="badge ${b.availableQuantity > 0 ? 'badge-success' : 'badge-danger'}">
                    ${b.availableQuantity > 0 ? 'IN STOCK' : 'OUT OF STOCK'}
                  </span>
                </td>
                <td>
                  <button class="btn btn-sm btn-secondary" onclick="openEditBookModal(${b.id})">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="handleDeleteBook(${b.id}, '${b.title.replace(/'/g, "\\'")}', ${issuedCopies})">Delete</button>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (e) {
        document.getElementById('inventory-tbody').innerHTML = '<tr><td colspan="9" style="text-align:center; color: var(--danger);">Failed to load inventory.</td></tr>';
      }
    }

    function openAddBookModal() {
      document.getElementById('book-edit-id').value = '';
      document.getElementById('book-title').value = '';
      document.getElementById('book-author').value = '';
      document.getElementById('book-category').value = '';
      document.getElementById('book-quantity').value = '5';
      clearAlert('modal-alert');
      openModal('add-book-modal');
    }

    function openEditBookModal(bookId) {
      const book = inventoryData.find(b => b.id === bookId);
      if (!book) return;

      document.getElementById('book-edit-id').value = book.id;
      document.getElementById('book-title').value = book.title;
      document.getElementById('book-author').value = book.author;
      document.getElementById('book-category').value = book.category;
      document.getElementById('book-quantity').value = book.quantity;
      clearAlert('modal-alert');
      openModal('add-book-modal');
    }

    async function handleSaveBook(e) {
      e.preventDefault();
      clearAlert('modal-alert');

      const id = document.getElementById('book-edit-id').value;
      const title = document.getElementById('book-title').value.trim();
      const author = document.getElementById('book-author').value.trim();
      const category = document.getElementById('book-category').value.trim();
      const quantity = parseInt(document.getElementById('book-quantity').value, 10);

      const isEdit = !!id;
      const method = isEdit ? 'PUT' : 'POST';
      const url = isEdit ? `${API_BASE_URL}/books/${id}` : `${API_BASE_URL}/books`;

      try {
        const res = await fetch(url, {
          method: method,
          headers: getAuthHeaders(),
          body: JSON.stringify({ title, author, category, quantity })
        });
        const result = await res.json();

        if (result.success) {
          closeModal('add-book-modal');
          showAlert('manage-alert', result.message, 'success');
          loadInventory();
        } else {
          showAlert('modal-alert', result.message || 'Error saving book.', 'danger');
        }
      } catch (e) {
        showAlert('modal-alert', 'Server error while saving book.', 'danger');
      }
    }

    async function handleDeleteBook(id, title, issuedCopies) {
      if (issuedCopies > 0) {
        alert(`Cannot delete '${title}': ${issuedCopies} copies are currently issued to students. Process their returns first.`);
        return;
      }
      if (!confirm(`Are you sure you want to permanently delete '${title}' from the catalog?`)) return;

      try {
        const res = await fetch(`${API_BASE_URL}/books/${id}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        const result = await res.json();
        if (result.success) {
          showAlert('manage-alert', result.message, 'success');
          loadInventory();
        } else {
          showAlert('manage-alert', result.message, 'danger');
        }
      } catch (e) {
        showAlert('manage-alert', 'Error deleting book.', 'danger');
      }
    }
  </script>
</body>
</html>
