# ===================================================================
# COLLEGE LIBRARY MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# B.Tech Technical Training (TT) Session Project
# ===================================================================

# Server Port
server.port=8080

# Spring Application Name
spring.application.name=College Library Management System

# MySQL 8 Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration for REST Authentication
jwt.secret=9a6747f3b5e4e207914f7b49463942078696d5b066bfda89ecf4c9c1b9794024
jwt.expiration-ms=86400000

# Daily Overdue Penalty in Rupees (INR)
library.penalty.daily-rate=5.00
library.loan.duration-days=7

# Logging
logging.level.com.college.library=INFO
logging.level.org.springframework.security=WARN
