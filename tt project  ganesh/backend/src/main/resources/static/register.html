<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - College Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Main Content -->
  <div class="main-container">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Student Registration</h2>
          <p>Create your student library account to search and borrow books</p>
        </div>

        <div id="register-alert"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ramesh Kumar" required minlength="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">College Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="e.g. ramesh@college.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. 9876543210">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-password">Password *</label>
              <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-type password" required minlength="6">
            </div>
          </div>

          <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">
            Create Student Account
          </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Already registered? <a href="login.html" style="color: var(--primary-blue); font-weight: 600; text-decoration: none;">Sign in here</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('register');
    });

    async function handleRegister(e) {
      e.preventDefault();
      clearAlert('register-alert');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        showAlert('register-alert', 'Passwords do not match. Please re-enter.', 'danger');
        return;
      }

      const submitBtn = document.getElementById('reg-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const response = await fetch(`${API_BASE_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            phone,
            password,
            confirmPassword
          })
        });

        const result = await response.json();

        if (result.success && result.data) {
          saveAuthSession(result.data);
          showAlert('register-alert', 'Registration successful! Redirecting to Student Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'student-dashboard.html';
          }, 1200);
        } else {
          showAlert('register-alert', result.message || 'Registration failed. Try again.', 'danger');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Student Account';
        }
      } catch (err) {
        showAlert('register-alert', 'Could not connect to server. Please ensure backend is running.', 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Student Account';
      }
    }
  </script>
</body>
</html>
